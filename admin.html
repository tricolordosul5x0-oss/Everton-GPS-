<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Everton GPS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        :root {
            --bg-main: #0a0d12;
            --bg-card: #131820;
            --border: rgba(255,255,255,.1);
            --signal-on: #00ffa6;
            --danger: #ff5470;
            --telemetry: #2dd4ff;
            --text: #eef2f6;
            --text-dim: #74808f;
        }
        body {
            margin: 0; padding: 0; font-family: system-ui, sans-serif;
            background: var(--bg-main); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        .auth-overlay {
            position: fixed; inset: 0; background: rgba(10, 13, 18, 0.95);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
            padding: 16px;
        }
        .auth-card {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 24px; border-radius: 12px; width: 100%; max-width: 380px;
            display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .auth-card h2 { margin: 0 0 4px 0; font-size: 1.4em; text-align: center; color: var(--text); }
        .auth-card label { font-size: 0.8em; text-transform: uppercase; color: var(--text-dim); font-weight: bold; display: block; margin-bottom: 6px; }
        .auth-card input {
            width: 100%; background: #1a212b; border: 1px solid var(--border);
            padding: 12px; border-radius: 8px; color: white; font-size: 1em; box-sizing: border-box;
        }
        .auth-card button {
            background: var(--telemetry); color: #000; border: none; padding: 14px;
            font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1em; text-transform: uppercase; width: 100%;
        }

        .filter-container {
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 1000;
        }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { flex: 1; min-width: 130px; display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 0.7em; text-transform: uppercase; color: var(--text-dim); font-weight: bold; }
        .filter-container input, .filter-container select {
            background: #1a212b; border: 1px solid var(--border); padding: 10px;
            border-radius: 6px; color: white; font-size: 0.9em; width: 100%; box-sizing: border-box;
        }
        .btn-pesquisar {
            background: var(--signal-on); color: #000; border: none; padding: 10px 16px;
            font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.9em; text-transform: uppercase; height: 39px;
        }
        .btn-tempo-real {
            background: var(--danger); color: #fff; border: none; padding: 10px 16px;
            font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.9em; text-transform: uppercase; height: 39px; display: none;
        }

        .alerta-vel {
            background: rgba(255, 84, 112, 0.2); border-bottom: 1px solid var(--danger);
            color: var(--danger); padding: 10px; text-align: center; font-weight: bold; font-size: 0.9em; z-index: 1000;
        }

        #telaSuspensa {
            display: none; position: fixed; inset: 0; z-index: 10001; background: #0a0d12;
            flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center;
        }
        .logo-suspenso {
            width: 96px; height: 96px; border-radius: 22px; background: linear-gradient(145deg,#ff5470,#c81f45);
            display: flex; align-items: center; justify-content: center; font-size: 2.6em;
            box-shadow: 0 8px 24px rgba(255,84,112,0.35); margin-bottom: 20px;
        }

        .main-content {
            display: flex; flex: 1; position: relative; overflow: hidden;
        }
        #map { flex: 1; height: 100%; background: #000; }

        #painelHistorico {
            width: 380px; background: var(--bg-card); border-left: 1px solid var(--border);
            display: none; flex-direction: column; z-index: 999; box-shadow: -4px 0 20px rgba(0,0,0,0.5);
        }
        .historico-header {
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; background: #18202a;
        }
        .historico-header h3 { margin: 0; font-size: 1em; color: var(--signal-on); }
        .historico-fechar { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.2em; }
        .historico-lista {
            flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .item-historico {
            background: #1a212b; border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; cursor: pointer; transition: all 0.2s; font-size: 0.85em;
        }
        .item-historico:hover { border-color: var(--telemetry); background: #212c3a; }
        .item-movimento { border-left: 4px solid var(--signal-on); }
        .item-parada { border-left: 4px solid #ffb020; }
        .item-topo { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
        .badge-mov { color: var(--signal-on); font-size: 0.75em; text-transform: uppercase; }
        .badge-parada { color: #ffb020; font-size: 0.75em; text-transform: uppercase; }
        .item-detalhe { color: var(--text-dim); font-size: 0.8em; margin-top: 2px; }

        /* NOVO: ponto de excesso de velocidade pisca em vermelho no mapa */
        @keyframes piscar-excesso {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }
        .ponto-excesso { animation: piscar-excesso 0.9s infinite; }

        /* NOVO: linha do trajeto "andando" (marching ants) — o traço tracejado se desloca
           continuamente no sentido do deslocamento, pra dar noção visual de ida/volta.
           Como a rota é desenhada em SVG pelo Leaflet, animamos o stroke-dashoffset do
           próprio elemento <path> da polyline. */
        @keyframes andar-tracejado {
            to { stroke-dashoffset: -40; }
        }
        .rota-ida path.leaflet-interactive {
            animation: andar-tracejado 1.6s linear infinite;
        }
        .rota-volta path.leaflet-interactive {
            animation: andar-tracejado 1.6s linear infinite reverse;
        }

        /* NOVO: responsivo pra celular — abaixo de 768px de largura */
        @media (max-width: 768px) {
            .filter-container { padding: 10px 12px; gap: 8px; }
            .filter-row { flex-direction: column; align-items: stretch; }
            .filter-group { min-width: 0; width: 100%; }
            .filter-container input, .filter-container select { font-size: 1em; padding: 12px; }
            .btn-pesquisar, .btn-tempo-real { width: 100%; height: 46px; font-size: 1em; }

            .main-content { flex-direction: column; }
            #map { flex: 1; min-height: 0; }

            /* O painel de histórico vira uma folha que sobe de baixo, cobrindo boa parte da
               tela — em vez de uma barra lateral de 380px que não cabe no celular. */
            #painelHistorico {
                position: absolute; left: 0; right: 0; bottom: 0; top: auto;
                width: 100%; height: 65%; max-height: 65%;
                border-left: none; border-top: 1px solid var(--border);
                border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            }
            .item-historico { padding: 12px 14px; font-size: 0.9em; }
            .auth-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="authScreen" class="auth-overlay">
        <div class="auth-card">
            <h2>🔐 Painel Admin</h2>
            <p style="font-size:0.85em; color:var(--text-dim); text-align:center; margin:0;">Faça login para gerenciar e pesquisar rotas da frota.</p>
            <div>
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu-email@gmail.com">
            </div>
            <div>
                <label>Senha</label>
                <input type="password" id="pass" placeholder="******">
            </div>
            <button onclick="fazerLogin()">Entrar no Painel</button>
        </div>
    </div>

    <div id="alertaContainer"></div>

    <div id="telaSuspensa">
        <div class="logo-suspenso">📡</div>
        <div style="font-size:1.1em; font-weight:bold; color:var(--text); letter-spacing:0.5px; margin-bottom:24px;">PAINEL EVERTON GPS</div>
        <div style="border:2px solid var(--danger); background:rgba(255,84,112,0.12); border-radius:12px; padding:20px 18px; max-width:360px;">
            <div style="font-size:2em; margin-bottom:8px;">🚫</div>
            <div style="color:var(--danger); font-weight:bold; font-size:1.05em; line-height:1.5;">ACESSO SUSPENSO</div>
            <div style="color:var(--danger); font-size:0.92em; margin-top:8px; line-height:1.5;">Entre em contato com o suporte para regularizar o pagamento.</div>
        </div>
    </div>

    <div class="filter-container">
        <div class="filter-row">
            <div class="filter-group">
                <label>Veículo</label>
                <select id="selectVeiculo">
                    <option value="">Carregando...</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Início (Data/Hora)</label>
                <input type="datetime-local" id="txtDataInicio">
            </div>
            <div class="filter-group">
                <label>Fim (Data/Hora)</label>
                <input type="datetime-local" id="txtDataFim">
            </div>
            <button class="btn-pesquisar" onclick="pesquisarHistorico()">🔍 Pesquisar</button>
            <button id="btnVoltarTempoReal" class="btn-tempo-real" onclick="voltarAoTempoReal()">🔴 Tempo Real</button>
        </div>
    </div>

    <div class="main-content">
        <div id="map"></div>
        <div id="painelHistorico">
            <div class="historico-header">
                <h3>📋 Histórico de Percurso</h3>
                <button class="historico-fechar" onclick="fecharPainelHistorico()">✕</button>
            </div>
            <div id="listaHistoricoEventos" class="historico-lista">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" crossorigin="anonymous"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwKIS8wL3D7OuaysVFV_xyAsFsKo2eXzY",
            databaseURL: "https://everton-gps-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const LOCATIONIQ_API_KEY = "pk.191e94f621fe663163bc05ef61c98b2b";

        const map = L.map('map').setView([-29.6133, -52.1919], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        
        let polyline = L.polyline([], { color: 'rgba(0,255,166,0.25)', weight: 3 }).addTo(map);
        let polylineRuas = L.polyline([], { color: '#00ffa6', weight: 5, dashArray: '10, 10', opacity: 0.95 }).addTo(map);
        let marcadoresPontos = [];
        let markerVeiculo = L.marker([-29.6133, -52.1919]).addTo(map);

        let listenerTempoReal = null;
        let refStatusEmpresa = null;
        let EMPRESA_ID_ATUAL = null;

        // CORREÇÃO: antes o código verificava `btnVoltarTempoReal.style.display === 'none'`
        // pra saber se estava em modo "tempo real" ou "histórico". Só que esse botão nunca
        // recebe um estilo inline até a primeira pesquisa ser feita — então, logo depois de
        // abrir o painel (antes de pesquisar qualquer coisa), `style.display` valia "" (string
        // vazia), não "none". Essa comparação sempre dava falso, e por isso trocar o veículo
        // no seletor não atualizava o mapa em tempo real (parecia que "o painel não
        // atualiza"). Agora usamos uma variável própria para controlar o modo atual.
        let emModoTempoReal = true;

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                db.ref('mapaUsuarioEmpresa/' + user.uid).once('value').then(function(snap) {
                    var empresaId = snap.val();
                    if (!empresaId) {
                        alert("Este login não está vinculado a nenhuma empresa. Fale com o suporte.");
                        auth.signOut();
                        return;
                    }
                    EMPRESA_ID_ATUAL = empresaId;
                    observarStatusEmpresa();
                    carregarListaVeiculos();
                    definirDatasPadrao();
                });
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('telaSuspensa').style.display = 'none';
                EMPRESA_ID_ATUAL = null;
                if (refStatusEmpresa) { refStatusEmpresa.off(); refStatusEmpresa = null; }
            }
        });

        function observarStatusEmpresa() {
            if (refStatusEmpresa) { refStatusEmpresa.off(); }
            refStatusEmpresa = db.ref('empresas/' + sanitizarChavePath(EMPRESA_ID_ATUAL) + '/status');
            refStatusEmpresa.on('value', function(snap) {
                var suspenso = snap.val() === 'suspenso';
                document.getElementById('telaSuspensa').style.display = suspenso ? 'flex' : 'none';
            });
        }

        function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value;
            if(!email || !pass) return alert("Preencha o e-mail e a senha!");
            
            auth.signInWithEmailAndPassword(email, pass)
                .catch(e => alert("Erro ao fazer login: " + e.message));
        }

        function definirDatasPadrao() {
            const agora = new Date();
            const umaHoraAtras = new Date(agora.getTime() - (60 * 60 * 1000));
            document.getElementById('txtDataFim').value = formatarDataInput(agora);
            document.getElementById('txtDataInicio').value = formatarDataInput(umaHoraAtras);
        }

        function formatarDataInput(data) {
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const dia = String(data.getDate()).padStart(2, '0');
            const hora = String(data.getHours()).padStart(2, '0');
            const min = String(data.getMinutes()).padStart(2, '0');
            return `${ano}-${mes}-${dia}T${hora}:${min}`;
        }

        function sanitizarChavePath(valor) {
            return String(valor).replace(/[.#$\[\]\/]/g, "_");
        }

        function carregarListaVeiculos() {
            db.ref('empresas/' + sanitizarChavePath(EMPRESA_ID_ATUAL) + '/veiculos').once('value', (snap) => {
                const veiculosObj = snap.val();
                const select = document.getElementById('selectVeiculo');
                select.innerHTML = "";
                
                if (!veiculosObj) {
                    select.innerHTML = '<option value="">Nenhum veículo cadastrado</option>';
                    return;
                }

                Object.keys(veiculosObj).forEach(vNome => {
                    let opt = document.createElement('option');
                    opt.value = vNome;
                    opt.textContent = vNome;
                    select.appendChild(opt);
                });

                const primeiroVeiculo = Object.keys(veiculosObj)[0];
                if (primeiroVeiculo) {
                    iniciarEscutaTempoReal(primeiroVeiculo);
                }
            });

            document.getElementById('selectVeiculo').addEventListener('change', function() {
                // CORREÇÃO: agora usa a variável `emModoTempoReal` (ver comentário acima)
                // em vez de checar o estilo do botão — trocar de veículo funciona
                // corretamente mesmo antes de qualquer pesquisa ter sido feita.
                if (emModoTempoReal) {
                    iniciarEscutaTempoReal(this.value);
                }
            });
        }

        function iniciarEscutaTempoReal(veiculoNome) {
            if (listenerTempoReal) {
                db.ref(listenerTempoReal).off();
            }

            const pathAtual = 'empresas/' + sanitizarChavePath(EMPRESA_ID_ATUAL) + '/veiculos/' + sanitizarChavePath(veiculoNome) + '/atual';
            listenerTempoReal = pathAtual;

            // CORREÇÃO: reinicia a trilha visual ao trocar de veículo (antes ficava
            // acumulando pontos do veículo anterior junto com o novo, misturando as duas
            // rotas na mesma linha).
            let historicoTempoRealCoords = [];
            polyline.setLatLngs([]);

            db.ref(pathAtual).on('value', (snap) => {
                const dados = snap.val();
                if (!dados) return;

                const { lat, lon, velocidade } = dados;
                if (lat && lon) {
                    markerVeiculo.setLatLng([lat, lon]);
                    map.setView([lat, lon], 16);

                    historicoTempoRealCoords.push([lat, lon]);
                    if (historicoTempoRealCoords.length > 500) historicoTempoRealCoords.shift();
                    polyline.setLatLngs(historicoTempoRealCoords);

                    const alertaBox = document.getElementById('alertaContainer');
                    if (velocidade > 80) {
                        alertaBox.innerHTML = `<div class="alerta-vel">⚠️ ALERTA: Excesso de velocidade ao vivo! (${velocidade} km/h)</div>`;
                        markerVeiculo.setIcon(new L.Icon.Default({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png' }));
                    } else {
                        alertaBox.innerHTML = "";
                        markerVeiculo.setIcon(new L.Icon.Default());
                    }
                }
            });
        }

        function converterParaTimestamp(p) {
            if (p.timestamp && !isNaN(Number(p.timestamp))) return Number(p.timestamp);
            if (p.time && !isNaN(Number(p.time))) return Number(p.time);
            if (p.dataHora) {
                let d = new Date(p.dataHora);
                if (!isNaN(d.getTime())) return d.getTime();
            }
            if (p.data && p.hora) {
                let partesData = p.data.split('/');
                if (partesData.length === 3) {
                    let [dia, mes, ano] = partesData;
                    let [hora, min, seg] = (p.hora || '00:00:00').split(':');
                    let dt = new Date(ano, mes - 1, dia, hora || 0, min || 0, seg || 0);
                    if (!isNaN(dt.getTime())) return dt.getTime();
                }
            }
            if (p.criadoEm) {
                let dt = new Date(p.criadoEm);
                if (!isNaN(dt.getTime())) return dt.getTime();
            }
            return Date.now();
        }

        function pesquisarHistorico() {
            const veiculo = document.getElementById('selectVeiculo').value;
            const inicioInput = document.getElementById('txtDataInicio').value;
            const fimInput = document.getElementById('txtDataFim').value;

            if (!veiculo) return alert("Selecione um veículo válido!");
            if (!inicioInput || !fimInput) return alert("Preencha a data e horário de início e término!");

            const tsInicioFiltro = new Date(inicioInput).getTime();
            const tsFimFiltro = new Date(fimInput).getTime();

            if (tsInicioFiltro >= tsFimFiltro) return alert("A data/horário inicial deve ser anterior à final!");

            if (listenerTempoReal) {
                db.ref(listenerTempoReal).off();
                listenerTempoReal = null;
            }
            emModoTempoReal = false;

            db.ref('empresas/' + sanitizarChavePath(EMPRESA_ID_ATUAL) + '/veiculos/' + sanitizarChavePath(veiculo) + '/historico').once('value', (snap) => {
                const historicoObj = snap.val();
                if (!historicoObj) {
                    alert("Nenhum histórico encontrado para este veículo.");
                    return;
                }

                let pontosFiltrados = [];
                Object.values(historicoObj).forEach(p => {
                    const tsPonto = converterParaTimestamp(p);
                    if (tsPonto >= tsInicioFiltro && tsPonto <= tsFimFiltro) {
                        pontosFiltrados.push({ ...p, timestampCalculado: tsPonto });
                    }
                });

                pontosFiltrados.sort((a, b) => a.timestampCalculado - b.timestampCalculado);

                if (pontosFiltrados.length === 0) {
                    alert("Nenhum registro encontrado neste intervalo de tempo selecionado.");
                    return;
                }

                let latLngs = [];
                let temExcessoVelocidade = false;

                marcadoresPontos.forEach(m => map.removeLayer(m));
                marcadoresPontos = [];

                let listaEventosHtml = '';

                pontosFiltrados.forEach((p, index) => {
                    latLngs.push([p.lat, p.lon]);
                    if (p.velocidade > 80) temExcessoVelocidade = true;

                    if (index === 0) {
                        markerVeiculo.setLatLng([p.lat, p.lon]);
                    }

                    let vel = Number(p.velocidade) || 0;
                    let emMovimento = vel > 3;
                    let badgeClass = emMovimento ? 'badge-mov' : 'badge-parada';
                    let badgeTexto = emMovimento ? 'Em Movimento' : 'Veículo Parado';
                    let iconeCor = emMovimento ? '#00ffa6' : '#ffb020';
                    // NOVO: ponto de excesso de velocidade agora sempre aparece em vermelho e
                    // piscando (classe .ponto-excesso), tanto pelo motivo salvo quanto pela
                    // velocidade do próprio ponto — cobre também registros antigos que não
                    // tinham o campo "motivo" preenchido.
                    let excessoNestePonto = (p.motivo === 'excesso_velocidade') || vel > 80;
                    if (excessoNestePonto) iconeCor = '#ff5470';

                    var pontoMarcador = L.circleMarker([p.lat, p.lon], {
                        radius: 5, color: iconeCor, fillColor: iconeCor, fillOpacity: 0.85, weight: 1.5,
                        className: excessoNestePonto ? 'ponto-excesso' : ''
                    }).addTo(map);

                    let dataObj = new Date(p.timestampCalculado);
                    let horarioTxt = p.hora || dataObj.toLocaleTimeString('pt-BR');
                    let dataTxt = p.data || dataObj.toLocaleDateString('pt-BR');
                    
                    let ruaNome = p.rua || p.address || p.endereco || "Endereço em processamento";
                    let bairroNome = p.bairro || "";
                    let cidadeNome = p.cidade || "Venâncio Aires";
                    let enderecoFormatado = ruaNome + (bairroNome ? ', ' + bairroNome : '') + ' - ' + cidadeNome;

                    pontoMarcador.bindPopup(
                        '<div style="font-size:0.85em;line-height:1.6;">' +
                        '<b>' + (emMovimento ? '🚗 Em Movimento' : '🅿️ Parado') + '</b><br>' +
                        (excessoNestePonto ? '<b style="color:#ff5470;">⚠️ Excesso de velocidade</b><br>' : '') +
                        '<b>📍 ' + ruaNome + '</b><br>' +
                        '🏙 ' + cidadeNome + '<br>' +
                        '🕐 ' + dataTxt + ' ' + horarioTxt + '<br>' +
                        '⚡ ' + vel + ' km/h' +
                        '</div>'
                    );
                    marcadoresPontos.push(pontoMarcador);

                    listaEventosHtml += `
                        <div class="item-historico ${emMovimento ? 'item-movimento' : 'item-parada'}" onclick="focarPonto(${p.lat}, ${p.lon}, '${encodeURIComponent(pontoMarcador.getPopup().getContent())}')">
                            <div class="item-topo">
                                <span>${dataTxt} ${horarioTxt}</span>
                                <span class="${badgeClass}">${badgeTexto}</span>
                            </div>
                            <div class="item-detalhe">📍 ${enderecoFormatado}</div>
                            <div class="item-detalhe">⚡ Velocidade: ${vel} km/h</div>
                        </div>
                    `;
                });

                document.getElementById('listaHistoricoEventos').innerHTML = listaEventosHtml;
                document.getElementById('painelHistorico').style.display = 'flex';

                polyline.setLatLngs(latLngs);
                if (latLngs.length > 0) {
                    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                }
                encaixarNasRuas(latLngs);

                const alertaBox = document.getElementById('alertaContainer');
                if (temExcessoVelocidade) {
                    alertaBox.innerHTML = `<div class="alerta-vel">⚠️ ALERTA: Excesso de velocidade (> 80 km/h) detectado neste intervalo!</div>`;
                    markerVeiculo.setIcon(new L.Icon.Default({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png' }));
                } else {
                    alertaBox.innerHTML = "";
                    markerVeiculo.setIcon(new L.Icon.Default());
                }

                document.getElementById('btnVoltarTempoReal').style.display = "block";
            });
        }

        function focarPonto(lat, lon, htmlPopup) {
            map.setView([lat, lon], 17);
            markerVeiculo.setLatLng([lat, lon]);
            markerVeiculo.bindPopup(decodeURIComponent(htmlPopup)).openPopup();
        }

        function fecharPainelHistorico() {
            document.getElementById('painelHistorico').style.display = 'none';
        }

        // NOVO: separa os trechos da rota "ida" e "volta" com base na ordem cronológica dos
        // pontos, e aplica a animação de traço "andando" em sentidos opostos em cada uma —
        // dá pra visualmente diferenciar o trajeto de ida do de volta mesmo quando passam
        // pela mesma rua. A divisão usa o ponto médio (no tempo) da lista de coordenadas
        // como corte simples entre ida/volta.
        let camadaRotaIda = null;
        let camadaRotaVolta = null;
        function desenharRotaComDirecao(coords) {
            if (camadaRotaIda) { map.removeLayer(camadaRotaIda); camadaRotaIda = null; }
            if (camadaRotaVolta) { map.removeLayer(camadaRotaVolta); camadaRotaVolta = null; }
            if (coords.length < 2) return;

            const meio = Math.ceil(coords.length / 2);
            const trechoIda = coords.slice(0, meio + 1);
            const trechoVolta = coords.slice(meio);

            camadaRotaIda = L.polyline(trechoIda, {
                color: '#2dd4ff', weight: 4, dashArray: '12, 10', opacity: 0.9, className: 'rota-ida'
            }).addTo(map);

            if (trechoVolta.length > 1) {
                camadaRotaVolta = L.polyline(trechoVolta, {
                    color: '#00ffa6', weight: 4, dashArray: '12, 10', opacity: 0.9, className: 'rota-volta'
                }).addTo(map);
            }
        }

        function encaixarNasRuas(coords) {
            polylineRuas.setLatLngs([]);
            if (coords.length < 2) return;
            let amostra = coords;
            const MAX_PONTOS_LOCATIONIQ = 25;
            if (coords.length > MAX_PONTOS_LOCATIONIQ) {
                amostra = [];
                const passo = Math.ceil(coords.length / (MAX_PONTOS_LOCATIONIQ - 1));
                for (let i = 0; i < coords.length; i += passo) amostra.push(coords[i]);
                amostra.push(coords[coords.length - 1]);
            }
            const str = amostra.map(c => c[1].toFixed(6) + "," + c[0].toFixed(6)).join(";");
            const url = "https://us1.locationiq.com/v1/matching/driving/" + str + "?key=" + LOCATIONIQ_API_KEY + "&overview=full&geometries=geojson";
            fetch(url, { signal: AbortSignal.timeout(12000) })
                .then(r => r.json())
                .then(data => {
                    let pts = [];
                    const trechos = data.matchings || data.routes || [];
                    trechos.forEach(m => { if (m.geometry && m.geometry.coordinates) m.geometry.coordinates.forEach(c => pts.push([c[1], c[0]])); });
                    if (pts.length > 0) {
                        polylineRuas.setLatLngs(pts);
                        desenharRotaComDirecao(pts);
                    } else {
                        desenharRotaComDirecao(coords);
                    }
                })
                .catch(() => { desenharRotaComDirecao(coords); });
        }

        function voltarAoTempoReal() {
            document.getElementById('btnVoltarTempoReal').style.display = "none";
            document.getElementById('painelHistorico').style.display = 'none';
            document.getElementById('alertaContainer').innerHTML = "";
            markerVeiculo.bindPopup("");
            marcadoresPontos.forEach(m => map.removeLayer(m));
            marcadoresPontos = [];
            polylineRuas.setLatLngs([]);
            if (camadaRotaIda) { map.removeLayer(camadaRotaIda); camadaRotaIda = null; }
            if (camadaRotaVolta) { map.removeLayer(camadaRotaVolta); camadaRotaVolta = null; }
            emModoTempoReal = true;
            const veiculoSelecionado = document.getElementById('selectVeiculo').value;
            if (veiculoSelecionado) {
                iniciarEscutaTempoReal(veiculoSelecionado);
                alert("Retornado ao modo ao vivo (tempo real).");
            }
        }
    </script>
</body>
</html>
