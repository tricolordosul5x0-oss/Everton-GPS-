<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Everton GPS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        :root {
            --bg-main: #0a0d12;
            --bg-card: #131820;
            --border: rgba(255,255,255,.1);
            --signal-on: #00ffa6;
            --danger: #ff5470;
            --telemetry: #2dd4ff;
            --text: #eef2f6;
            --text-dim: #74808f;
        }
        body {
            margin: 0; padding: 0; font-family: system-ui, sans-serif;
            background: var(--bg-main); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        .auth-overlay {
            position: fixed; inset: 0; background: rgba(10, 13, 18, 0.95);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
            padding: 16px;
        }
        .auth-card {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 24px; border-radius: 12px; width: 100%; max-width: 380px;
            display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .auth-card h2 { margin: 0 0 4px 0; font-size: 1.4em; text-align: center; color: var(--text); }
        .auth-card label { font-size: 0.8em; text-transform: uppercase; color: var(--text-dim); font-weight: bold; display: block; margin-bottom: 6px; }
        .auth-card input {
            width: 100%; background: #1a212b; border: 1px solid var(--border);
            padding: 12px; border-radius: 8px; color: white; font-size: 1em; box-sizing: border-box;
        }
        .auth-card button {
            background: var(--telemetry); color: #000; border: none; padding: 14px;
            font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1em; text-transform: uppercase; width: 100%;
        }

        .filter-container {
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 1000;
        }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { flex: 1; min-width: 130px; display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 0.7em; text-transform: uppercase; color: var(--text-dim); font-weight: bold; }
        .filter-container input, .filter-container select {
            background: #1a212b; border: 1px solid var(--border); padding: 10px;
            border-radius: 6px; color: white; font-size: 0.9em; width: 100%; box-sizing: border-box;
        }
        .btn-pesquisar {
            background: var(--signal-on); color: #000; border: none; padding: 10px 16px;
            font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.9em; text-transform: uppercase; height: 39px;
        }
        .btn-tempo-real {
            background: var(--danger); color: #fff; border: none; padding: 10px 16px;
            font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.9em; text-transform: uppercase; height: 39px; display: none;
        }

        .alerta-vel {
            background: rgba(255, 84, 112, 0.2); border-bottom: 1px solid var(--danger);
            color: var(--danger); padding: 10px; text-align: center; font-weight: bold; font-size: 0.9em; z-index: 1000;
        }

        #map { flex: 1; width: 100%; background: #000; }
    </style>
</head>
<body>

    <div id="authScreen" class="auth-overlay">
        <div class="auth-card">
            <h2>🔐 Painel Admin</h2>
            <p style="font-size:0.85em; color:var(--text-dim); text-align:center; margin:0;">Faça login para gerenciar e pesquisar rotas da frota.</p>
            <div>
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu-email@gmail.com">
            </div>
            <div>
                <label>Senha</label>
                <input type="password" id="pass" placeholder="******">
            </div>
            <button onclick="fazerLogin()">Entrar no Painel</button>
        </div>
    </div>

    <div id="alertaContainer"></div>

    <div class="filter-container">
        <div class="filter-row">
            <div class="filter-group">
                <label>Veículo</label>
                <select id="selectVeiculo">
                    <option value="">Carregando...</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Início (Data/Hora)</label>
                <input type="datetime-local" id="txtDataInicio">
            </div>
            <div class="filter-group">
                <label>Fim (Data/Hora)</label>
                <input type="datetime-local" id="txtDataFim">
            </div>
            <button class="btn-pesquisar" onclick="pesquisarHistorico()">🔍 Pesquisar</button>
            <button id="btnVoltarTempoReal" class="btn-tempo-real" onclick="voltarAoTempoReal()">🔴 Tempo Real</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" crossorigin="anonymous"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwKIS8wL3D7OuaysVFV_xyAsFsKo2eXzY",
            databaseURL: "https://everton-gps-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const map = L.map('map').setView([-29.6133, -52.1919], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        
        let polyline = L.polyline([], { color: '#00ffa6', weight: 5, dashArray: '10, 10' }).addTo(map);
        let markerVeiculo = L.marker([-29.6133, -52.1919]).addTo(map);

        const EMPRESA_ID = "tricolordosul5x0_gmail_com";
        let listenerTempoReal = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                carregarListaVeiculos();
                definirDatasPadrao();
            } else {
                document.getElementById('authScreen').style.display = 'flex';
            }
        });

        function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value;
            if(!email || !pass) return alert("Preencha o e-mail e a senha!");
            
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('authScreen').style.display = 'none';
                    carregarListaVeiculos();
                    definirDatasPadrao();
                })
                .catch(e => alert("Erro ao fazer login: " + e.message));
        }

        function definirDatasPadrao() {
            const agora = new Date();
            const umaHoraAtras = new Date(agora.getTime() - (60 * 60 * 1000));
            document.getElementById('txtDataFim').value = formatarDataInput(agora);
            document.getElementById('txtDataInicio').value = formatarDataInput(umaHoraAtras);
        }

        function formatarDataInput(data) {
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const dia = String(data.getDate()).padStart(2, '0');
            const hora = String(data.getHours()).padStart(2, '0');
            const min = String(data.getMinutes()).padStart(2, '0');
            return `${ano}-${mes}-${dia}T${hora}:${min}`;
        }

        function sanitizarChavePath(valor) {
            return String(valor).replace(/[.#$\[\]\/]/g, "_");
        }

        function carregarListaVeiculos() {
            db.ref('empresas/' + sanitizarChavePath(EMPRESA_ID) + '/veiculos').once('value', (snap) => {
                const veiculosObj = snap.val();
                const select = document.getElementById('selectVeiculo');
                select.innerHTML = "";
                
                if (!veiculosObj) {
                    select.innerHTML = '<option value="">Nenhum veículo cadastrado</option>';
                    return;
                }

                Object.keys(veiculosObj).forEach(vNome => {
                    let opt = document.createElement('option');
                    opt.value = vNome;
                    opt.textContent = vNome;
                    select.appendChild(opt);
                });

                // Iniciar o tempo real automaticamente com o primeiro veículo da lista
                const primeiroVeiculo = Object.keys(veiculosObj)[0];
                if (primeiroVeiculo) {
                    iniciarEscutaTempoReal(primeiroVeiculo);
                }
            });

            // Quando trocar o veículo no select, se estiver em tempo real, atualiza a escuta
            document.getElementById('selectVeiculo').addEventListener('change', function() {
                if (document.getElementById('btnVoltarTempoReal').style.display === 'none') {
                    iniciarEscutaTempoReal(this.value);
                }
            });
        }

        function iniciarEscutaTempoReal(veiculoNome) {
            if (listenerTempoReal) {
                db.ref(listenerTempoReal).off();
            }

            const pathAtual = 'empresas/' + sanitizarChavePath(EMPRESA_ID) + '/veiculos/' + sanitizarChavePath(veiculoNome) + '/atual';
            listenerTempoReal = pathAtual;

            let historicoTempoRealCoords = [];

            db.ref(pathAtual).on('value', (snap) => {
                const dados = snap.val();
                if (!dados) return;

                const { lat, lon, velocidade } = dados;
                if (lat && lon) {
                    markerVeiculo.setLatLng([lat, lon]);
                    map.setView([lat, lon], 16);

                    historicoTempoRealCoords.push([lat, lon]);
                    if (historicoTempoRealCoords.length > 500) historicoTempoRealCoords.shift();
                    polyline.setLatLngs(historicoTempoRealCoords);

                    const alertaBox = document.getElementById('alertaContainer');
                    if (velocidade > 80) {
                        alertaBox.innerHTML = `<div class="alerta-vel">⚠️ ALERTA: Excesso de velocidade ao vivo! (${velocidade} km/h)</div>`;
                        markerVeiculo.setIcon(new L.Icon.Default({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png' }));
                    } else {
                        alertaBox.innerHTML = "";
                        markerVeiculo.setIcon(new L.Icon.Default());
                    }
                }
            });
        }

        function converterParaTimestamp(dataStr, horaStr) {
            if (!dataStr || !horaStr) return 0;
            const [dia, mes, ano] = dataStr.split('/');
            const [hora, min, seg] = horaStr.split(':');
            return new Date(ano, mes - 1, dia, hora, min, seg || 0).getTime();
        }

        function pesquisarHistorico() {
            const veiculo = document.getElementById('selectVeiculo').value;
            const inicioInput = document.getElementById('txtDataInicio').value;
            const fimInput = document.getElementById('txtDataFim').value;

            if (!veiculo) return alert("Selecione um veículo válido!");
            if (!inicioInput || !fimInput) return alert("Preencha a data e horário de início e término!");

            const tsInicioFiltro = new Date(inicioInput).getTime();
            const tsFimFiltro = new Date(fimInput).getTime();

            if (tsInicioFiltro >= tsFimFiltro) return alert("A data/horário inicial deve ser anterior à final!");

            // Pausa o tempo real ao pesquisar histórico
            if (listenerTempoReal) {
                db.ref(listenerTempoReal).off();
                listenerTempoReal = null;
            }

            db.ref('empresas/' + sanitizarChavePath(EMPRESA_ID) + '/veiculos/' + sanitizarChavePath(veiculo) + '/historico').once('value', (snap) => {
                const historicoObj = snap.val();
                if (!historicoObj) {
                    alert("Nenhum histórico encontrado para este veículo.");
                    return;
                }

                let pontosFiltrados = [];
                Object.values(historicoObj).forEach(p => {
                    if (p.data && p.hora) {
                        const tsPonto = converterParaTimestamp(p.data, p.hora);
                        if (tsPonto >= tsInicioFiltro && tsPonto <= tsFimFiltro) {
                            pontosFiltrados.push({ ...p, timestamp: tsPonto });
                        }
                    }
                });

                pontosFiltrados.sort((a, b) => a.timestamp - b.timestamp);

                if (pontosFiltrados.length === 0) {
                    alert("Nenhum registro encontrado neste intervalo de tempo selecionado.");
                    return;
                }

                let latLngs = [];
                let temExcessoVelocidade = false;

                pontosFiltrados.forEach((p, index) => {
                    latLngs.push([p.lat, p.lon]);
                    if (p.velocidade > 80) temExcessoVelocidade = true;

                    if (index === 0) {
                        markerVeiculo.setLatLng([p.lat, p.lon]);
                        markerVeiculo.bindPopup("Início do Período").openPopup();
                    }
                });

                polyline.setLatLngs(latLngs);
                if (latLngs.length > 0) {
                    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                }

                const alertaBox = document.getElementById('alertaContainer');
                if (temExcessoVelocidade) {
                    alertaBox.innerHTML = `<div class="alerta-vel">⚠️ ALERTA: Excesso de velocidade (> 80 km/h) detectado neste intervalo!</div>`;
                    markerVeiculo.setIcon(new L.Icon.Default({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png' }));
                } else {
                    alertaBox.innerHTML = "";
                    markerVeiculo.setIcon(new L.Icon.Default());
                }

                // Mostra o botão para voltar ao tempo real
                document.getElementById('btnVoltarTempoReal').style.display = "block";
            });
        }

        function voltarAoTempoReal() {
            document.getElementById('btnVoltarTempoReal').style.display = "none";
            document.getElementById('alertaContainer').innerHTML = "";
            markerVeiculo.bindPopup("");
            const veiculoSelecionado = document.getElementById('selectVeiculo').value;
            if (veiculoSelecionado) {
                iniciarEscutaTempoReal(veiculoSelecionado);
                alert("Retornado ao modo ao vivo (tempo real).");
            }
        }
    </script>
</body>
</html>
