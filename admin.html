<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin - Everton GPS Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; background: #0a0d12; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; width: 100%; min-height: 60vh; }
        .auth-overlay { position: fixed; inset:0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: #131820; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .alerta-vel { background: #ff5470; color: white; padding: 10px; text-align: center; font-weight: bold; }
        .filter-bar { background: #131820; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 0.9em; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 0.75em; text-transform: uppercase; color: #74808f; font-weight: bold; }
        .filter-bar input, .filter-bar select { background: #1a212b; border: 1px solid rgba(255,255,255,0.08); padding: 8px; border-radius: 6px; color: white; }
        .filter-bar button { background: #2dd4ff; color: #000; border: none; padding: 9px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; align-self: flex-end; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-overlay">
        <div class="card">
            <h2>Painel Admin - Login</h2>
            <input type="email" id="email" placeholder="Email"><br><br>
            <input type="password" id="pass" placeholder="Senha"><br><br>
            <button onclick="fazerLogin()">Acessar Painel</button>
        </div>
    </div>

    <div id="alertaContainer"></div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Veículo</label>
            <select id="selectVeiculo"><option value="">Selecione...</option></select>
        </div>
        <div class="filter-group">
            <label>Início (Data e Hora)</label>
            <input type="datetime-local" id="txtDataInicio">
        </div>
        <div class="filter-group">
            <label>Fim (Data e Hora)</label>
            <input type="datetime-local" id="txtDataFim">
        </div>
        <button onclick="filtrarHistorico()">Pesquisar Período</button>
    </div>

    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwKIS8wL3D7OuaysVFV_xyAsFsKo2eXzY",
            databaseURL: "https://everton-gps-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const map = L.map('map').setView([-29.6133, -52.1919], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        let polyline = L.polyline([], {color: '#00ffa6', dashArray: '10, 10'}).addTo(map);
        let markerInicio = L.marker([-29.6133, -52.1919]).addTo(map).bindPopup("Início da Pesquisa");
        let markerFim = L.marker([-29.6133, -52.1919]).bindPopup("Fim da Pesquisa");

        const EMPRESA_ID = "tricolordosul5x0_gmail_com";

        function fazerLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('authScreen').style.display = 'none';
                    carregarListaVeiculos();
                })
                .catch(e => alert(e.message));
        }

        function carregarListaVeiculos() {
            db.ref('empresas/' + EMPRESA_ID + '/veiculos').once('value', (snap) => {
                const veiculos = snap.val();
                if(!veiculos) return;
                const select = document.getElementById('selectVeiculo');
                select.innerHTML = "";
                Object.keys(veiculos).forEach(vNome => {
                    let opt = document.createElement('option');
                    opt.value = vNome;
                    opt.textContent = vNome;
                    select.appendChild(opt);
                });
            });
        }

        // Converte string "DD/MM/YYYY" e "HH:MM:SS" para objeto Timestamp em milissegundos
        function converterParaTimestamp(dataStr, horaStr) {
            if (!dataStr || !horaStr) return 0;
            const [dia, mes, ano] = dataStr.split('/');
            const [hora, min, seg] = horaStr.split(':');
            return new Date(ano, mes - 1, dia, hora, min, seg || 0).getTime();
        }

        function filtrarHistorico() {
            const veiculo = document.getElementById('selectVeiculo').value;
            const inicioInput = document.getElementById('txtDataInicio').value;
            const fimInput = document.getElementById('txtDataFim').value;

            if (!veiculo) return alert("Selecione um veículo!");
            if (!inicioInput || !fimInput) return alert("Preencha a data e horário de início e fim!");

            const tsInicioFiltro = new Date(inicioInput).getTime();
            const tsFimFiltro = new Date(fimInput).getTime();

            if (tsInicioFiltro >= tsFimFiltro) return alert("A data/horário inicial deve ser anterior à final!");

            db.ref('empresas/' + EMPRESA_ID + '/veiculos/' + veiculo + '/historico').once('value', (snap) => {
                const historicoObj = snap.val();
                if (!historicoObj) {
                    alert("Nenhum histórico encontrado para este veículo.");
                    return;
                }

                let pontosFiltrados = [];
                Object.values(historicoObj).forEach(p => {
                    if (p.data && p.hora) {
                        const tsPonto = converterParaTimestamp(p.data, p.hora);
                        if (tsPonto >= tsInicioFiltro && tsPonto <= tsFimFiltro) {
                            pontosFiltrados.push({ ...p, timestamp: tsPonto });
                        }
                    }
                });

                // Ordenar por ordem cronológica
                pontosFiltrados.sort((a, b) => a.timestamp - b.timestamp);

                if (pontosFiltrados.length === 0) {
                    alert("Nenhum registro encontrado neste intervalo de tempo.");
                    return;
                }

                let latLngs = [];
                let temExcessoVelocidade = false;

                pontosFiltrados.forEach((p, index) => {
                    latLngs.push([p.lat, p.lon]);
                    if (p.velocidade > 80) temExcessoVelocidade = true;

                    // Marca o primeiro ponto
                    if (index === 0) {
                        markerInicio.setLatLng([p.lat, p.lon]);
                        markerInicio.addTo(map);
                    }
                    // Marca o último ponto
                    if (index === pontosFiltrados.length - 1) {
                        markerFim.setLatLng([p.lat, p.lon]);
                        markerFim.addTo(map);
                    }
                });

                polyline.setLatLngs(latLngs);
                if (latLngs.length > 0) {
                    map.fitBounds(polyline.getBounds());
                }

                if (temExcessoVelocidade) {
                    document.getElementById('alertaContainer').innerHTML = `<div class="alerta-vel">⚠️ ALERTA: Detectado excesso de velocidade (> 80 km/h) neste intervalo!</div>`;
                    markerInicio.setIcon(new L.Icon.Default({iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png'}));
                } else {
                    document.getElementById('alertaContainer').innerHTML = "";
                    markerInicio.setIcon(new L.Icon.Default());
                }
            });
        }
    </script>
</body>
</html>
