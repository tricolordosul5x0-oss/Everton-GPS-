name: Build APK

# Roda automaticamente a cada envio de arquivos, e também pode ser
# disparado manualmente pela aba "Actions" do GitHub (botão "Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Preparar pastas e Gerar Ícone do App
        run: |
          mkdir -p assets
          cp 1784006845314.png assets/icon.png
          npm install @capacitor/assets --no-save
          npx capacitor-assets generate

      - name: Adicionar permissões de localização
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          if "ACCESS_BACKGROUND_LOCATION" not in content:
              content = content.replace("<application", perms + "\n    <application", 1)
          if "android.permission.WAKE_LOCK" not in content:
              content = content.replace(
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />',
                  1
              )
          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace(
                  '<uses-permission android:name="android.permission.WAKE_LOCK" />',
                  '<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
                  1
              )
          with open(path, "w") as f:
              f.write(content)
          print("Permissões adicionadas com sucesso.")
          EOF

      - name: Corrigir tipo de serviço em segundo plano (exigido no Android 14+)
        run: |
          python3 - <<'EOF'
          import glob, re

          # A partir do Android 14, não basta ter a permissão de localização em segundo
          # plano — o próprio <service> que roda o rastreio (declarado dentro do plugin
          # de background-geolocation, não no seu app) precisa declarar
          # android:foregroundServiceType="location". Sem isso, o Android recusa ou
          # derruba o serviço silenciosamente, mesmo com todas as permissões certas.
          # Esse manifest vive dentro do node_modules do plugin, então a correção
          # precisa ser feita aqui, antes da compilação.
          candidatos = glob.glob(
              "node_modules/**/background-geolocation/**/AndroidManifest.xml",
              recursive=True
          )

          if not candidatos:
              print("AVISO: não encontrei o AndroidManifest.xml do plugin de rastreio em segundo plano.")
              print("Verifique se o nome do pacote em package.json ainda é @capacitor-community/background-geolocation.")
          else:
              def adicionar_tipo(m):
                  tag = m.group(0)
                  if "android:foregroundServiceType" in tag:
                      return tag
                  if tag.endswith("/>"):
                      return tag[:-2].rstrip() + ' android:foregroundServiceType="location" />'
                  return tag[:-1].rstrip() + ' android:foregroundServiceType="location">'

              for caminho in candidatos:
                  with open(caminho) as f:
                      conteudo = f.read()
                  original = conteudo
                  conteudo = re.sub(r'<service\b[^>]*/?>', adicionar_tipo, conteudo)

                  if "<service" not in original:
                      print("Nenhuma tag <service> em: " + caminho + " (arquivo ignorado)")
                      continue

                  if conteudo != original:
                      with open(caminho, "w") as f:
                          f.write(conteudo)
                      print("CORRIGIDO: " + caminho)
                  else:
                      print("Já estava correto: " + caminho)
          EOF

      - name: Sincronizar Capacitor com o projeto Android
        run: npx cap sync android

      - name: Compilar o APK (versão de teste/instalação direta)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: rastreador-everton-gps-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
